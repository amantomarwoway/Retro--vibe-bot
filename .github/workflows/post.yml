name: Retro Vibe Dual Bot

on:
  schedule:
    - cron: '30 3 * * *' # Roz 9 AM IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install All
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg wget curl
          pip install requests yt-dlp --upgrade
      - name: Run Bot
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python bot.py
