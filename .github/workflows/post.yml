name: Retro Vibe Bot - YT to FB

on:
  schedule:
    - cron: '30 3 * * *' # Roz subah 9 AM IST (3:30 UTC) pe auto chalega
  workflow_dispatch: # Manual Run ka button bhi rahega

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget
          pip install requests yt-dlp

      - name: Run Bot
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python bot.py
