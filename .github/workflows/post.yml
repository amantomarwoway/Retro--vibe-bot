name: Retro Video Tab
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'   # 9:30 AM IST
    - cron: '0 14 * * *'  # 7:30 PM IST
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg wget -qq
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      - run: pip install requests -q
      - run: python bot.py
        env: {FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}}
