name: Retro Video Tab
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 14 * * *'
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg wget -qq
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install requests
        run: pip install requests -q
      - name: Run Bot
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python bot.py
